name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f cti_recommender/requirements.txt ]; then pip install -r cti_recommender/requirements.txt; fi
          pip install pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q
